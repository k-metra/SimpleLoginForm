<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <link rel="stylesheet" href="style.css">
        <title>Login Page</title>
    </head>

    <body>
        <div class="bg-overlay" aria-hidden="true"></div>
        <main class="card" role="main" aria-labelledby="loginHeading">
            <div class="brand">
                <div class="logo">
                    L
                </div>
                <div>
                    <h1 class="loginHeading">Welcome back</h1>
                    <p class="sub">Login to continue to your dashboard</p>
                </div>
            </div>

            <div class="invalid">
                <p id="invalid" hidden>* Invalid username or password.</p>
            </div>

            <form autocomplete="on" action="" id="loginForm">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name= "username"type="username" type="text" placeholder="Username" required="true">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" type="text" placeholder="Password" required="true">
                </div>

                <div class="row">
                    <label class="remember">
                        <input type="checkbox" id="remember"/>
                        Remember me

                    </label>

                    <a href="#" id="forgot">Forgot password?</a>
                </div>

                <div class="actions">
                    <button class="primary" type="submit" id="loginBtn">Sign In</button>
                </div>

                <div class="links">
                    <span>Don't have an account?</span>
                    <a href="#">Create account</a>
                </div>

                <div class="small">By signing in you agree to our Terms of Privacy.</div>
            </form>
        </main>
    </body>

    <script src="script.js"></script>
</html>
